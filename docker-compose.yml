services:

  postgres:
    image: postgres:18.6
    container_name: revenueguard-postgres

    environment:
      POSTGRES_DB: revenueguard
      POSTGRES_USER: revenueguard
      POSTGRES_PASSWORD: revenueguard_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueguard -d revenueguard"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:8.10.2-alpine
    container_name: revenueguard-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data:
